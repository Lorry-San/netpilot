name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: sh -n public/install-agent.sh public/update-agent.sh scripts/update.sh

  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - run: go mod download
      - run: go test ./...
      - run: mkdir -p ../dist
      - name: Build Linux agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/netpilot-agent-linux-${GOARCH} .
      - uses: actions/upload-artifact@v4
        with:
          name: netpilot-agent-linux-${{ matrix.goarch }}
          path: dist/netpilot-agent-linux-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netpilot-agent-linux-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum netpilot-agent-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netpilot-agent-linux-*
            dist/SHA256SUMS
          generate_release_notes: true

  agent-image:
    needs: [server, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/netpilot-agent" >> "$GITHUB_OUTPUT"
          echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.image.outputs.version }}
